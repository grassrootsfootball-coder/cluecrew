name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cluecrew_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: staging
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cluecrew_test
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cluecrew_shadow
      AUTH_SECRET: ci-only-secret-not-used-anywhere-real
      CRON_SECRET: ci-only-cron-secret

    steps:
      # Full history: check:register reads COMMIT MESSAGES as one of the four routes a rule
      # citation arrives by — the widest of them, and the one that was invisible when R64 and R65
      # went unregistered. A shallow clone would leave that route unread, and the check would say
      # so rather than pass over it silently, but reading it is better than reporting it missing.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Write root .env for workspace scripts
        run: |
          {
            echo "APP_ENV=$APP_ENV"
            echo "DATABASE_URL=$DATABASE_URL"
            echo "SHADOW_DATABASE_URL=$SHADOW_DATABASE_URL"
            echo "AUTH_SECRET=$AUTH_SECRET"
            echo "CRON_SECRET=$CRON_SECRET"
          } > .env

      - name: Create shadow database
        run: PGPASSWORD=postgres createdb -h localhost -U postgres cluecrew_shadow

      - name: Prisma generate
        run: pnpm --filter @cluecrew/db generate

      - name: Apply migrations
        run: pnpm --filter @cluecrew/db migrate:deploy

      - name: Migration drift check
        run: pnpm db:migrate:check

      # THE CONTENT ITSELF (R1039). Migrations build an empty store; the seed and the generator add
      # only synthetic and DRAFT rows. Everything reviewed — English, the bank questions, every
      # signature — comes from the committed snapshot of the dev database's content tables. Restore
      # refuses a non-empty table and a migration mismatch, then re-reads the database and compares
      # it table by table with the files, so a partial load fails here, not twenty steps later.
      # The seed and generator then run ON TOP of the real store: with the reviewed-content guard
      # (R62) that makes them a test that a derivation change has not rewritten reviewed rows.
      # The repository is public, so the snapshot is committed ENCRYPTED; the key is a repository
      # secret. With no key the restore REFUSES rather than skipping (forks get no secrets).
      - name: Load the content snapshot
        env:
          SNAPSHOT_KEY: ${{ secrets.SNAPSHOT_KEY }}
        run: pnpm snapshot:restore

      - name: Seed
        run: pnpm --filter @cluecrew/db seed

      # The seed only creates the Phase 1 synthetic items — three VR types. The
      # item bank for the other eighteen comes from this generator, and without
      # it any case outside those three has an EMPTY pool: no practice item can
      # be served, so mid-session tests wait forever. Idempotent, DRAFT-only.
      - name: Generate the item bank
        run: pnpm content:generate

      - name: Typecheck
        run: pnpm -r run typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests + simulations (coverage-gated)
        run: pnpm test:coverage

      - name: L2 firewall grep (no modality profiles)
        run: pnpm check:l2

      - name: Mascot single-door guard
        run: pnpm check:mascot

      - name: Reading-age lint (child-facing content)
        run: pnpm check:reading-age

      - name: Asset manifest + image weight budget
        run: pnpm check:assets

      - name: Content schema validation
        run: pnpm validate:content

      # Guards the exclusion the two steps above depend on. content/pilot-review lives inside
      # content/, so both scanners walk it, and neither can describe an item batch — the
      # exclusion was added after CI had been red for eight commits, and its failure pointed at
      # the wrong fix. Drives both scanners end to end against a planted canary, and checks the
      # canary still bites before trusting that it didn't.
      - name: Pilot-review exclusion guard
        run: pnpm check:pilot-exclusion

      # BUILD-DISTRICT-NVR gates 2/5/6/7: determinism, density caps,
      # colourblind safety over ~2,000 sampled items, disjoint seed ranges,
      # and plan-versus-generator agreement. Deliberately bad fixtures prove
      # the checks bite; a template change that skips a version bump is
      # caught by the fingerprint, not by anyone remembering.
      - name: NVR generator gates
        run: pnpm check:nvr

      # Anne's question, 2026-08-12: has anything signed moved since signing, and how would we
      # know? Recomputes all 33 family fingerprints against the hash recorded at signing, from
      # BOTH ends — a family-side walk cannot see a signature whose family left the array it
      # walks, which is how en-vocab-in-context stayed invisible. Carries its own canary: if a
      # fingerprint function stops responding to the surface it hashes, every family would read
      # "unmoved" forever. Scope is the declared surface only; see the script header.
      - name: Signed-family fingerprints (nothing moved since signing)
        run: pnpm verify:fingerprints

      # Annie's condition, 2026-08-12, and it runs on the SAME trigger as the step above on
      # purpose. A fingerprint guards the DECLARED SURFACE and cannot see emitted behaviour:
      # replacing a family's generator body does not move its hash, and
      # spag-punct-terminal-boundary is the proof — surface intact, T4/T5 items outside its own
      # ladder. The sweeps are the only instrument for that, and they had run twice in this
      # project's history, both times because someone asked. ~4.5s for ~35,000 emitted items
      # across both districts. Asserts only; the reviewer artefacts still come from
      # `sweep:maths-params` / `export:param-sweep`, which call the same functions (R42).
      # The third leg (annie, 2026-08-12). The fingerprint guards the declared surface and the
      # sweeps guard emitted behaviour; neither sees the SENTENCES. Per-entry hashes, so an EDIT
      # or REMOVAL of a signed sentence VOIDS the signature and needs a ruling (R34), while an
      # ADDITION does not void but moves familyDepth and is reported as a depth re-check.
      # Guards generator banks only — DB-authored comprehension items are a different mechanism.
      - name: Signed-family bank content (the sentences themselves)
        run: pnpm verify:bank-content

      # Self-test first, same idiom as the chapter scanner. The success report NAMES the maths
      # families the sweep is out of scope for; a passing run that lost that line would read as
      # coverage of all 19 when the gate asserts about 6. The self-test fails if the scope goes.
      - name: Parameter sweeps (emitted behaviour matches the signed sheets)
        run: pnpm verify:param-sweeps --self-test && pnpm verify:param-sweeps

      # The two doors into the database must apply the SAME child-facing gate. They did not: the
      # script importer ran a pre-R23 version that rejected a walk-script quotation the generator
      # and the publish doors accepted. Fixed 2026-08-09; this keeps them from drifting apart again.
      - name: Gate parity (generator vs import door)
        run: pnpm compare:gates

      - name: Banned-vocabulary scan
        run: pnpm scan:vocab

      - name: Palette audit (manifesto §6 token roles + contrast)
        run: pnpm audit:palette

      # Addendum E §3: screens generated + imported items against the source
      # fingerprint index. Skips loudly until SIMILARITY_INDEX_PATH is set at
      # the repo/environment level (the index lives in private storage, never
      # in this repo).
      - name: Similarity gate (Addendum E §3)
        run: pnpm similarity:scan

      # David's ruling 2026-08-02: the gates run against the DATABASE too.
      # The lint reads /content and the scanner reads source files, so an
      # import straight into a table used to evade both. Serving rows fail
      # the build; the DRAFT backlog is reported, not blocking.
      # "Guarded" as a property of the write path, not a list of files. Any writer that COMPUTES
      # a child-facing value must classify before writing; transcribing a human ruling needs no
      # guard. Static, so a new deriving writer fails on the commit that adds it.
      # docs/authoring-calibration-log.md is THE REGISTER; CLAUDE.md is what a session loads and
      # must carry the operative text, not a pointer. Both hold content, so they can drift — and
      # did: R60, R61 and R62 were written into CLAUDE.md and never reached the register, found
      # only because R63 went to cite R62. Asserts the direction that matters: a rule cited as
      # governing must be recorded.
      # R65: a signature names a PERSON. recordSignature refuses a reviewerId that does not resolve
      # to a Reviewer row, and this fails any file writing action:'SIGNED' outside that door — the
      # same shape as check:derived-writes. Stale HISTORICAL exemptions are reported too: two of
      # the original five named files that only QUERY signatures.
      - name: Signing doors (a signature names a reviewer)
        run: pnpm check:signing-doors

      # R106: the door's own blockers, run over the whole district. It REPORTS rather than fails —
      # 224 refusals is the current true state and blocking on it would block every push until the
      # reviewer has ruled. What it must not do is go quiet: a route it cannot screen prints
      # NOT SCREENED rather than 0.
      - name: Verdict refusals (what stands between the bank and a signature)
        run: pnpm check:verdict-refusals

      # R110/R155: a retag is only a release if the SUCCESSOR is approved. The tolerance for an
      # absent delivery is now INSIDE the step, declared, and prints UNMEASURABLE — so this line
      # carries no exception and a reader of the yaml is not required to know why one was there.
      - name: Retag releases (moving a dependency does not discharge it)
        run: pnpm check:retag-releases

      # R120, and it BLOCKS as of R155. The `|| true` was added when 34 SPaG items were
      # undeliverable by a decision nobody had made; that decision is made and all 372 are
      # deliverable, so the tolerance has outlived its reason. A step that tolerates a condition
      # after the condition is gone is a step nobody can fail.
      - name: Serving path (can what came in come out?)
        run: pnpm check:serving-path

      # R143: a generator moving under stored rows. Blocks, because an unprotected divergence means
      # the generator changed and nobody noticed — and it needs no baseline, so it is true from the
      # first run rather than from the first backfill.
      - name: VR re-derivation (generators still produce what is stored)
        run: pnpm check:vr-rederive

      # R132: the shipped clusters, gated as they were shipped. These two are LIVE and in front of
      # children, so a change that would make either unshippable must fail the build rather than be
      # reported — the only checks here that block, because they are the only ones about live content.
      - name: Shipped clusters stay shippable
        run: pnpm check:cluster ENG-028 && pnpm check:cluster ENG-001

      # R167: every declared carriage destination must resolve against the live schema. Blocks —
      # a destination that was dropped or that moved is a broken path for a field Cowork still sends,
      # and both were invisible for weeks while `carriedAt` was prose.
      - name: Carriage destinations resolve
        run: pnpm check:carriage-schema

      # R168: a cloze item claiming a gap that does not exist, two items claiming one gap, or a
      # vehicle whose declared gapCount has drifted from its own text. Blocks: the gap number is
      # child-facing, the population is 16, and the check is instant.
      - name: Cloze gaps (claimed once, and present in the text)
        run: pnpm check:cloze-gaps

      # Annie ruled walkScript child-facing UNTIL MEASURED, and the measurement is that no
      # apps/web path a child can reach reads it. That is true today and would stop being true
      # the first time someone wires the authored walk into the Walk mode shell, which is built
      # and empty and is the obvious place it will go. A grep result rots; this does not.
      - name: walkScript reachability (the measurement, kept honest)
        run: pnpm check:walkscript-reach

      # The population Walk mode and the maths gates are both instances of: something declared,
      # validated at the door, and consumed by nothing. Fails on a NEW one; prints the backlog in
      # full every run so a known list cannot decay into a green tick.
      - name: Declared but unread (what we name and never consume)
        run: pnpm check:declared-unread

      # The preview repeats the sentence under test. A normaliser that "tidied" its punctuation
      # would delete the question while leaving something on screen that still looks like one.
      - name: Error-spot preview is verbatim
        run: pnpm check:errorspot-preview

      # A verdict option ("no mistake", "no word is needed") judges the whole rather than offering
      # a candidate. Pinned last on every card, asserted through the real shuffle over 200 children
      # — the property holds by authoring accident today and the shuffle is free to break it.
      - name: Verdict options are served last
        run: pnpm check:verdict-option-last

      # Annie's line, in writing and asserted: no ruled-note banner, status pill or reviewer badge
      # on any surface a child can reach.
      - name: No review furniture on a served surface
        run: pnpm check:no-review-furniture

      # Cowork's method, adopted after it found what a population-named sweep could not: walk every
      # LIVE row behind a Case door and screen EVERY string it holds, however deeply nested. A
      # sweep named for a field can only ever clear that field.
      - name: Every string field on every served row
        run: pnpm check:every-string-field

      # R358/R1042: a superseded value stored INSIDE the field it replaced (`stem._previousText`,
      # `content._previousValue`) is read as live by anything walking the container. They now live in
      # the `superseded` sibling column; any `_`-key found back inside stem, explanation or option
      # content, at any depth, fails.
      - name: No superseded value inside the field it supersedes
        run: pnpm check:superseded-inside-field

      # Quote fields are a THIRD CLASS: not child-facing (the reading-age cap over quoted Victorian
      # prose would fail Grahame on every line), not staff prose either — a record of what the
      # passage says, checked by exact match against it. Stronger than a punctuation sweep: a
      # doubled opening mark is not in the source, so it fails without anyone naming the shape.
      - name: Source-of-truth quotes match the passage
        run: pnpm check:source-quotes

      # A headword served to a child carries a tier — on the population the rule was written for.
      # stem.words[] does three jobs; an undeclared word-bearing type fails, because every default
      # is wrong: guess components and a vocabulary family leaves scope, guess headword and a
      # compound bank is blocked over words nobody would tier.
      - name: Served headwords carry a tier
        run: pnpm check:headword-tiers

      - name: Staged artefacts match the digests they crossed under (R754)
        run: pnpm check:staged-digests

      - name: Register check (every cited rule has a register entry)
        run: pnpm check:register

      - name: Derived-write guard (computed values classify before writing)
        run: pnpm check:derived-writes

      - name: Raw SQL guard (shipped code runs parameterised SQL only)
        run: pnpm check:raw-sql

      - name: Model-spend guard (no undeclared, uncapped model-provider calls)
        run: pnpm check:model-spend

      # ROOT SCRIPTS WERE NEVER TYPECHECKED -- `pnpm -r` visits workspace PACKAGES and scripts/ is
      # in none of them, so ~90 files that write to the database sat outside every type check.
      # Three wrong call signatures had shipped clean, one of them inside check:outside-writes.
      # A RATCHET: 24 pre-existing files are on a declared list, everything else is checked, and a
      # file that starts typechecking must come OFF the list or this fails.
      - name: Typecheck the root scripts
        run: pnpm typecheck:scripts

      # THE RETURN LEG STEP IS RETIRED (David, 2026-11-22 -- R1034): Cowork is no longer used, so
      # there is no authoring side to return anything to. The DB is the only store. The script stays
      # for history; nothing it measured is owed to anyone now.

      # EIGHT MORE COWORK-CHANNEL STEPS RETIRED (David, 2026-11-22 -- R1041), as the return leg was.
      # Each read the Cowork delivery/return folders under ~/Downloads/11+ or Cowork's own claims, so
      # on a CI runner they could only fail and locally they watched a channel nothing travels any
      # more: gate-library-fresh, item-population, reissue-completion, import-refusals,
      # amendments-landed, stamp-covers-payload, draft-assessment, manifest-drift. The scripts stay
      # runnable by hand; the step comments that explained them are in git history.

      # BOTH STORES GATE ON A DECLARED QUOTED SPAN AND NEITHER CAN SEE THE OTHER'S DECLARATIONS.
      # R339 found four texts here whose pass/fail turns on the declaration alone, swinging 11-14
      # words, one LIVE -- Cowork held a declaration we did not, and both gates were correct while
      # reading different rows. Fails on ACTIVE (a verdict differs today, so one store is refusing
      # what the other serves) and reports LATENT, which needs Cowork to act. Until their set
      # arrives it prints NOT RECEIVED, never "0 divergences".
      - name: Declaration sets (do both stores declare the same spans?)
        run: pnpm check:declaration-sets

      # A DIRECTORY THE OTHER SIDE READS NEEDS A GUARD ON WHAT ENTERS IT, not only on what changes
      # inside it. deliver() hashes the staged bytes and writes a .sha256 sidecar; a cp does the
      # copy and none of the rest, and the result was indistinguishable from a delivery. Five
      # artefacts went that way in two days and the only tell was a missing sidecar nothing read.
      # Fails on BYPASS (copied in, never staged) and OVERWRITTEN (sidecar no longer describes the
      # file); reports the dated pre-mechanism backlog, which is legitimate but not a pass.
      - name: Outbound sidecars (nothing enters that folder except through the door)
        run: pnpm check:outbound-sidecars

      # A GENERATED ARTEFACT DECLARES ITS GENERATOR, AND THIS ASSERTS THEY AGREE (R747). Six rows
      # drifted in the authoring store with no record and nobody would have known but for an
      # unrelated search: a generated bank that no longer matches its generator has two sources of
      # truth and no way to say which is authoritative.
      - name: Generator agreement (declared, and reproducing)
        run: pnpm check:generator-agreement

      # THE DATABASE FACTS PRISMA DOES NOT KNOW. Six migrations hold SQL Prisma cannot express --
      # triggers, functions, named CHECKs, expression defaults -- and that set is exactly what a
      # routine `migrate dev` can silently overwrite. It already overwrote one (R83). Two halves:
      # every invariant must hold, and every hand-written fact must HAVE an invariant, so the next
      # hand-written migration cannot land unasserted.
      # THE HISTORY MUST REBUILD THE STATE. Two hand-picked migration timestamps went in the wrong
      # order -- the DROP DEFAULT dated earlier than the SET -- so replaying history converged on a
      # default the live database did not have. Every check here reads the LIVE database, so
      # check:db-invariants passed 13 of 13 while a database rebuilt from migrations would have
      # failed that exact invariant. The record must reproduce the state it describes.
      - name: Migration replay (history rebuilds the live schema)
        run: pnpm check:migration-replay

      - name: Database invariants (what Prisma can silently overwrite)
        run: pnpm check:db-invariants

      # A MACHINE VERDICT MUST NOT WEAR A PERSON'S NAME, nor a person's verdict a machine's. Screens
      # the store in both directions; it cannot screen prose, and says so, because the one instance
      # we have was right in every row and wrong in a ruling.
      - name: Authority shape (whose verdict is this)
        run: pnpm check:authority-shape

      # THE WRITE BOUNDARY. Database TRIGGERS record every mutation of a content table, so
      # application code cannot opt out -- a write from a script, from Prisma Studio, from psql or
      # from another agent lands identically. This compares that record against AttributionEvent
      # and names any write with no ruling behind it. It FAILS only on reviewed content; an
      # unattributed write to a DRAFT row is reported. It also states the boundary's install date
      # on every run, because every write before that is invisible to it and always will be.
      - name: Outside writes (a change nobody decided)
        run: pnpm check:outside-writes

      # TWO THINGS ARE BOTH CALLED REVIEW. Cowork's preReview is a drafting agent assessing its
      # own work -- both its verdict values mean a human has NOT looked -- and Annie's ratification
      # resolves to a named individual through the naming path. Model them as one and a
      # self-assessment looks like a sign-off in the store that ships. This fences the column off
      # statically, the same way check:signing-doors fences its door. The subject check reports a
      # claim still attached to an item that has since moved.
      - name: Review queries (a self-assessment is not a sign-off)
        run: pnpm check:review-queries

      - name: Database content gate (child-facing text in the DB)
        run: pnpm check:db-content

      # David's ruling 2026-08-02: a line citation is the one part of an item
      # nobody can check by reading it, and five bad references survived three
      # authoring rounds. Same policy as the gate above — serving fails, the
      # DRAFT backlog is reported.
      - name: Line-reference gate (citations resolve against the passage)
        run: pnpm check:line-refs

      # R49, 2026-08-11: composeMockPaper can only cap technique repetition on items that
      # DECLARE their technique. Same serving/DRAFT split as the two gates above.
      - name: Technique-key audit (whole-text-purpose T4 comprehension items)
        run: pnpm audit:technique-keys

      # R51, 2026-08-11: needs no persistence path — runs against COMMA_BANK directly, the same
      # way export-param-sweep.ts runs against generator functions rather than the database.
      - name: Comma mirrored-pair cardinality audit
        run: pnpm audit:comma-pairs

      # David's ruling 2026-08-02: a word puzzle's answer is DERIVED from its
      # own rule and counted, never asserted — the same discipline as the
      # Maths computed key. An item with more than one valid answer marks a
      # child wrong for being right.
      # THE FREQUENCY FILE IS FETCHED, NEVER COMMITTED (David, 2026-11-22 -- R1041). SUBTLEX-UK's
      # licence is unestablished, so the bytes stay out of git; the gate refuses any file whose
      # sha256 differs from the digest pinned in packages/core/src/frequency-signal.ts. Without it
      # the whole gate died in CI, single-answer checks included.
      - name: Fetch the SUBTLEX-UK frequency file (pinned by digest)
        run: curl -fsSL --retry 3 -o data/frequency/SUBTLEX-UK.txt.zip https://psychology.nottingham.ac.uk/subtlex-uk/SUBTLEX-UK.txt.zip

      - name: Word-puzzle gate (single answer, no label collisions)
        run: pnpm check:word-puzzles

      # An audit sample showed the key as option A on every item — the pack
      # printed stored (key-first) order without the per-child serving shuffle.
      # This gate makes the safety standing: every bank uniform in storage, and
      # no bank's SERVED key position above chance through the real shuffle.
      # The stated safety changed under R199: storage uniformity is REPORTED (it costs a
      # review-pack tell, not a child anything); SERVED fairness and segment order are what fail.
      - name: Option-position gate (served key fair; segmented items reconstruct)
        run: pnpm check:option-positions

      # No list-valued relation is read without an orderBy — physical row order is not an
      # order, and one UPDATE re-permuted every child's letters before this existed (R186-R188).
      - name: Unordered-include gate
        run: pnpm check:unordered-includes

      # The three PLATFORM-IMPORT files are the only record of what Cowork's library claimed
      # before its own normalisation overwrote it (R201/R202). Not copies — witnesses (R203).
      - name: Pinned witnesses present and unaltered
        run: pnpm check:witnesses

      # Every MATHS item's key is computed from its solution expression —
      # a wrong key fails the build (BUILD-DISTRICT-MATHS §5, gate #3).
      - name: Solution verification (Maths district)
        run: pnpm verify:solutions

      # Every MATHS distractor tagged with a derivable misconception must BE
      # the number that misconception produces on the item's operands — the
      # distractor IS the executed error, not just labelled with it
      # (BUILD-DISTRICT-MATHS §5, gate #4).
      - name: Derivable distractor gate (Maths district)
        run: pnpm check:maths-distractors

      # The VR analogue (reviewer audit, 2026-08-05): a VR distractor tagged with
      # an executable misconception must BE the value that misconception produces
      # on the item's operands — not a fixed-slot near-miss. Catches the class of
      # bug a reviewer found by reading fifty items by hand.
      - name: Derivable distractor gate (VR district)
        run: pnpm check:vr-distractors

      # The Anti-Marker Law (story map rule 10): self-test proves every rule
      # fires, then the real scan gates any chapters past draft.
      - name: Chapter style scanner (Anti-Marker Law)
        run: node scripts/scan-chapter-style.mjs --self-test && pnpm scan:chapter-style

      # Chapter publishing validation: clue-tap items LIVE, seeded words real,
      # audio present on release (STORY BIBLE Laws 4–5, Real-Puzzle Law).
      - name: Chapter verification
        run: pnpm verify:chapters

      - name: Bursary isolation grep (no UI reads isBursary)
        run: pnpm check:bursary

      - name: Dependency audit
        run: pnpm audit --audit-level high

      - name: Build
        run: pnpm build

      - name: Install Playwright browsers
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium

      # `e2e:only` — the Build step above already produced it, and `pnpm e2e`
      # (the local one-liner) builds first. Same binary either way.
      - name: E2E (child-token isolation, CSP, daily loop, billing, CMS)
        run: pnpm --filter @cluecrew/web e2e:only

      # The LIT half of story mode. The suite above runs with STORY_MODE unset and proves the
      # surface is dark; that was the only half tested until 2026-08-12. STORY_MODE and APP_ENV
      # are both read from the server's environment, so the lit config owns three servers: one
      # over an e2e fixture chapter (the clue-tap path), and two over content/chapters differing
      # only in APP_ENV — which is the whole of the review-status rule, released everywhere and
      # review outside production. The gated pair is the first-delivery path: the chapters they
      # serve passed the four content gates above, which run before this step. Verified to FAIL
      # with the flag off and with no chapter present, so a pass means the lit path rendered.
      - name: E2E story mode (STORY_MODE=on — shelf, reader, clue-tap, review status)
        run: pnpm --filter @cluecrew/web e2e:story

      # AFTER the suites, because two of its three guards are only meaningful once they have run:
      # that the seeded zz-e2e-* fixtures were not mutated, and that no row bearing an e2e
      # provenance marker survived. The third — every creation marker is one cleanupFixtures
      # actually sweeps — is static, and closes the convention-in-a-comment gap that let
      # story-lit strand a LIVE item if a run crashed before teardown.
      - name: E2E fixture guard (fixtures intact, markers sweepable, no residue)
        run: pnpm check:e2e-fixtures

      # Traces and screenshots for the failing tests, so a CI-only failure can
      # be diagnosed from evidence instead of guessed at from a stack trace.
      - name: Upload Playwright evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidence
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: checks

    # The build prerenders marketing pages that read the Region Registry, so
    # this job needs a real database — not the placeholder URL it used before
    # region links existed. A seeded DB also means Lighthouse measures pages
    # with real content rather than empty ones.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cluecrew_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: staging
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cluecrew_test
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cluecrew_shadow
      AUTH_SECRET: ci-only-secret-not-used-anywhere-real
      CRON_SECRET: ci-only-cron-secret

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Write root .env for workspace scripts
        run: |
          {
            echo "APP_ENV=$APP_ENV"
            echo "DATABASE_URL=$DATABASE_URL"
            echo "SHADOW_DATABASE_URL=$SHADOW_DATABASE_URL"
            echo "AUTH_SECRET=$AUTH_SECRET"
            echo "CRON_SECRET=$CRON_SECRET"
          } > .env
      - name: Prisma generate
        run: pnpm --filter @cluecrew/db generate
      - name: Apply migrations
        run: pnpm --filter @cluecrew/db migrate:deploy
      # R1064: the same content snapshot the checks job loads, so Lighthouse measures the pages
      # children actually get, not the empty seeded store.
      - name: Load the content snapshot
        env:
          SNAPSHOT_KEY: ${{ secrets.SNAPSHOT_KEY }}
        run: pnpm snapshot:restore
      - name: Seed
        run: pnpm --filter @cluecrew/db seed

      # The seed only creates the Phase 1 synthetic items — three VR types. The
      # item bank for the other eighteen comes from this generator, and without
      # it any case outside those three has an EMPTY pool: no practice item can
      # be served, so mid-session tests wait forever. Idempotent, DRAFT-only.
      - name: Generate the item bank
        run: pnpm content:generate
      - name: Build
        run: pnpm build
      # Performance budget is a release gate (D6). The script starts the
      # server and mints a real child session first, so /crew is measured as
      # the actual child app rather than the anonymous access gate.
      - name: Lighthouse CI (authenticated /crew)
        run: pnpm perf
