name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cluecrew_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: staging
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cluecrew_test
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cluecrew_shadow
      AUTH_SECRET: ci-only-secret-not-used-anywhere-real
      CRON_SECRET: ci-only-cron-secret

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Write root .env for workspace scripts
        run: |
          {
            echo "APP_ENV=$APP_ENV"
            echo "DATABASE_URL=$DATABASE_URL"
            echo "SHADOW_DATABASE_URL=$SHADOW_DATABASE_URL"
            echo "AUTH_SECRET=$AUTH_SECRET"
            echo "CRON_SECRET=$CRON_SECRET"
          } > .env

      - name: Create shadow database
        run: PGPASSWORD=postgres createdb -h localhost -U postgres cluecrew_shadow

      - name: Prisma generate
        run: pnpm --filter @cluecrew/db generate

      - name: Apply migrations
        run: pnpm --filter @cluecrew/db migrate:deploy

      - name: Migration drift check
        run: pnpm db:migrate:check

      - name: Seed
        run: pnpm --filter @cluecrew/db seed

      # The seed only creates the Phase 1 synthetic items — three VR types. The
      # item bank for the other eighteen comes from this generator, and without
      # it any case outside those three has an EMPTY pool: no practice item can
      # be served, so mid-session tests wait forever. Idempotent, DRAFT-only.
      - name: Generate the item bank
        run: pnpm content:generate

      - name: Typecheck
        run: pnpm -r run typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests + simulations (coverage-gated)
        run: pnpm test:coverage

      - name: L2 firewall grep (no modality profiles)
        run: pnpm check:l2

      - name: Mascot single-door guard
        run: pnpm check:mascot

      - name: Reading-age lint (child-facing content)
        run: pnpm check:reading-age

      - name: Asset manifest + image weight budget
        run: pnpm check:assets

      - name: Content schema validation
        run: pnpm validate:content

      - name: Banned-vocabulary scan
        run: pnpm scan:vocab

      - name: Palette audit (manifesto §6 token roles + contrast)
        run: pnpm audit:palette

      # Addendum E §3: screens generated + imported items against the source
      # fingerprint index. Skips loudly until SIMILARITY_INDEX_PATH is set at
      # the repo/environment level (the index lives in private storage, never
      # in this repo).
      - name: Similarity gate (Addendum E §3)
        run: pnpm similarity:scan

      - name: Bursary isolation grep (no UI reads isBursary)
        run: pnpm check:bursary

      - name: Dependency audit
        run: pnpm audit --audit-level high

      - name: Build
        run: pnpm build

      - name: Install Playwright browsers
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E (child-token isolation, CSP, daily loop, billing, CMS)
        run: pnpm e2e

      # Traces and screenshots for the failing tests, so a CI-only failure can
      # be diagnosed from evidence instead of guessed at from a stack trace.
      - name: Upload Playwright evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidence
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: checks

    # The build prerenders marketing pages that read the Region Registry, so
    # this job needs a real database — not the placeholder URL it used before
    # region links existed. A seeded DB also means Lighthouse measures pages
    # with real content rather than empty ones.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cluecrew_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: staging
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cluecrew_test
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cluecrew_shadow
      AUTH_SECRET: ci-only-secret-not-used-anywhere-real
      CRON_SECRET: ci-only-cron-secret

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Write root .env for workspace scripts
        run: |
          {
            echo "APP_ENV=$APP_ENV"
            echo "DATABASE_URL=$DATABASE_URL"
            echo "SHADOW_DATABASE_URL=$SHADOW_DATABASE_URL"
            echo "AUTH_SECRET=$AUTH_SECRET"
            echo "CRON_SECRET=$CRON_SECRET"
          } > .env
      - name: Prisma generate
        run: pnpm --filter @cluecrew/db generate
      - name: Apply migrations
        run: pnpm --filter @cluecrew/db migrate:deploy
      - name: Seed
        run: pnpm --filter @cluecrew/db seed

      # The seed only creates the Phase 1 synthetic items — three VR types. The
      # item bank for the other eighteen comes from this generator, and without
      # it any case outside those three has an EMPTY pool: no practice item can
      # be served, so mid-session tests wait forever. Idempotent, DRAFT-only.
      - name: Generate the item bank
        run: pnpm content:generate
      - name: Build
        run: pnpm build
      # Performance budget is a release gate (D6). The script starts the
      # server and mints a real child session first, so /crew is measured as
      # the actual child app rather than the anonymous access gate.
      - name: Lighthouse CI (authenticated /crew)
        run: pnpm perf
