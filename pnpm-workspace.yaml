packages:
  - apps/*
  - packages/*
# Security patches for transitive deps flagged by `pnpm audit` (CI gate).
# Revisit whenever next/next-auth update their own ranges.
overrides:
  postcss: '>=8.5.18 <9'
  sharp: '>=0.35.0'
  # 2026-08-08: five high advisories turned CI red once the lint failures ahead of the audit
  # step were cleared and the step finally ran. All five are PATCH-level bumps on transitive
  # tooling deps, so they are overridden rather than ignored — an ignore is for a patch that
  # would break a consumer (see the brace-expansion note below), not for one that lands cleanly.
  brace-expansion@<1.1.18: '^1.1.18'
  brace-expansion@>=2.0.0 <2.1.4: '^2.1.4'
  brace-expansion@>=4.0.0 <5.0.9: '^5.0.9'
  js-yaml@>=4.0.0 <4.3.1: '^4.3.1'
  nanoid@<3.3.17: '^3.3.17'
auditConfig:
  ignoreGhsas:
    # brace-expansion DoS via crafted glob input. The advisory's only patched
    # major (v5) breaks minimatch/glob CJS consumers, and the code is a
    # build-time glob helper never fed untrusted input here. Re-check when
    # minimatch ships a compatible fix.
    - GHSA-mh99-v99m-4gvg
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
  sharp: true
